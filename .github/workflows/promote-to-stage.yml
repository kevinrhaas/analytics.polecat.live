name: Promote dev to stage

# The pipeline's FULL gate. Merges dev into stage, runs the WHOLE Playwright
# suite (tests/run.js, ~2,900 checks) on the stage tree, then assembles the
# staged /stage/ form (tools/stage-preview.mjs) and boot-smokes it — so both the
# code AND the staging are proven before the preview publishes. Red → stage is
# rolled straight back to its pre-promotion commit and an issue is filed.
# The green/red outcome of this workflow IS the stage status record —
# promote-to-prod.yml and Manager's Pipeline view read it from the Actions
# API; there is no separate state file.
#
# Fires on:
#   • manual dispatch (Kevin or Manager) — always promotes, schedule ignored
#   • an hourly cron tick, gated by .github/pipeline.json via
#     tools/pipeline-schedule.mjs (currently daily at 07:00Z ≈ 2am Central)
on:
  workflow_dispatch:
    inputs:
      reason:
        description: Why this promotion is being run (free text, for the log)
        required: false
  schedule:
    - cron: '37 * * * *'

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: promote-to-stage
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Schedule gate (cron ticks only — dispatch always promotes)
        id: gate
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "due=true" >> "$GITHUB_OUTPUT"     # a dispatch always promotes
            exit 0
          fi
          if ! node tools/pipeline-schedule.mjs; then
            echo "due=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # NOTHING-TO-PROMOTE guard. The schedule now fires across a several-hour
          # catch-up window (see tools/pipeline-schedule.mjs) so a delayed cron tick
          # can still carry the night's promotion. That means several ticks are
          # "due" — this keeps only the FIRST one doing work: once stage already
          # contains dev, there is nothing to promote and the rest exit quietly
          # instead of re-running the full suite. If dev moves again inside the
          # window, the next tick promotes the newer work, which is what we want.
          git fetch origin dev stage --quiet 2>/dev/null || true
          DEV="$(git rev-parse origin/dev 2>/dev/null || echo none)"
          if [ "$DEV" != "none" ] && git merge-base --is-ancestor "$DEV" origin/stage 2>/dev/null; then
            echo "stage already contains dev ($DEV) — nothing to promote"
            echo "due=false" >> "$GITHUB_OUTPUT"
          else
            echo "due=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge main into dev (hotfix back-merge), then dev into stage
        id: merge
        if: steps.gate.outputs.due == 'true'
        run: |
          set -e
          git config user.name  "analytics-bot"
          git config user.email "bot@users.noreply.github.com"
          if ! git fetch origin dev stage 2>/dev/null; then
            echo "::error::dev/stage branches missing — dispatch pipeline-setup.yml first."
            exit 1
          fi

          # Back-merge: dev must stay a superset of main so hotfixes are never
          # lost at the next promotion. A conflict needs a human — abort + report.
          git checkout -B dev origin/dev
          if ! git merge --no-edit origin/main; then
            git merge --abort || true
            gh issue create --title "stage promotion blocked: main→dev back-merge conflict" \
              --body "Automatic back-merge of main into dev hit conflicts and was aborted. Resolve on dev, then re-dispatch promote-to-stage. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
            echo "::error::main→dev back-merge conflicted."
            exit 1
          fi
          git push origin dev

          STAGE_PREV="$(git rev-parse origin/stage)"
          echo "stage_prev=$STAGE_PREV" >> "$GITHUB_OUTPUT"
          git checkout -B stage origin/stage
          COUNT="$(git rev-list --count stage..dev)"
          if [ "$COUNT" = "0" ]; then
            echo "Nothing to promote — stage already contains dev."
            echo "promoted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          RANGE="$(git rev-parse --short stage)..$(git rev-parse --short dev)"
          git merge --no-ff dev -m "Promote dev→stage: $COUNT commit(s) ($RANGE)"
          git push origin stage
          echo "promoted=true" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install Playwright Chromium
        if: steps.merge.outputs.promoted == 'true'
        run: |
          npm install -g playwright
          npx playwright install --with-deps chromium

      - name: FULL suite on the stage tree (tests/run.js)
        if: steps.merge.outputs.promoted == 'true'
        run: NODE_PATH=$(npm root -g) node tests/run.js

      - name: Staged /stage/ form boots clean (stage assembly + boot smoke)
        if: steps.merge.outputs.promoted == 'true'
        run: |
          node tools/stage-preview.mjs . stage "$(git rev-parse --short stage)"
          SMOKE_PREFIX=/stage NODE_PATH=$(npm root -g) node tools/dev-smoke.mjs

      - name: "Red: roll stage back to its pre-promotion commit"
        if: failure() && steps.merge.outputs.promoted == 'true'
        run: |
          STAGE_PREV="${{ steps.merge.outputs.stage_prev }}"
          STAGE_NOW="$(git rev-parse stage)"
          # stage is a machine-owned pointer; this lease only rewinds the exact
          # merge this run just pushed. main is never force-pushed, anywhere.
          git push --force-with-lease=refs/heads/stage:"$STAGE_NOW" origin "$STAGE_PREV":refs/heads/stage
          gh issue create --title "stage promotion failed: suite red, stage rolled back" \
            --body "The full suite (or the staged-form boot smoke) failed on the promoted stage, so stage was rolled back to \`${STAGE_PREV}\`. dev still carries the promoted commits — fix on dev and re-promote. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
          echo "::error::stage gate failed — stage rolled back to ${STAGE_PREV}."
        env:
          GH_TOKEN: ${{ github.token }}

      - name: "Green: publish the new /stage/ preview"
        if: success() && steps.merge.outputs.promoted == 'true'
        run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
