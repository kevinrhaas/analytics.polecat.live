name: Deploy to GitHub Pages

# Static-site deploy for analytics.polecat.live. Replaces GitHub's default
# "deploy from a branch" pipeline, which has NO concurrency control — a single
# `pages` concurrency group with cancel-in-progress means a newer push cancels
# an in-flight deploy, so only the latest one runs and never fails on
# contention.
#
# Since the promotion-pipeline adoption (docs/PIPELINE.md; jobtracker's
# docs/PIPELINE.md is the canonical runbook) the Pages artifact carries THREE
# stages:
#   /        production  = main            (untouched, real sw.js, indexed)
#   /stage/     candidate   = the stage branch   (stage-preview: re-based paths,
#   /dev/    integration = the dev branch    stub SW, noindex, stage banner)
# The stage steps no-op while the stage/dev refs don't exist, so this workflow is
# safe to merge before pipeline-setup.yml ever runs. Main is ALWAYS assembled
# at the artifact root regardless of which branch's push triggered the run.
# The promotion workflows push with GITHUB_TOKEN (which can't trigger `push`),
# so they dispatch this workflow explicitly — same bridge Guard main uses.
#
# NOTE: requires repo Settings → Pages → Source = "GitHub Actions".

on:
  push:
    branches: [main, stage, dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # SOFT test signal — this MUST NOT gate the live deploy. A hard `needs: test` gate was
  # briefly added and it FROZE the live site for ~21 hours: a flaky CI-only test failed the
  # `test` job, so `deploy` never ran and ~55 versions never went live while the repo kept
  # advancing. The pipeline now runs this same suite as a HARD gate at stage-promotion time
  # (promote-to-stage.yml) — which is fine, because that gates an integration branch, never
  # the production deploy. `continue-on-error: true` keeps this run as a visible signal
  # WITHOUT ever blocking or failing the deploy.
  # DO NOT re-add `needs: test` to the deploy job — see STATUS.md "CI / deploy" convention.
  test:
    # Only on real pushes — the preview re-dispatch below re-enters this same
    # workflow on main, and running the ~10-minute suite twice per merge doubles
    # CI for no extra signal.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Playwright (global, no repo package.json)
        run: npm install -g playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Playwright test suite
        run: NODE_PATH=$(npm root -g) node tests/run.js

  # PREVIEW-REFRESH (2026-08-07): Pages deployments can only run from main.
  # The `github-pages` environment carries a deployment-branch policy, so a
  # `deploy` job on a dev/stage ref is REJECTED before a runner is even
  # assigned — a 1-second failure with no steps and no logs. That is exactly
  # what happened to every steward merge overnight: the push fired this
  # workflow, the deploy job was refused, and /dev/ silently stayed frozen at
  # the last main deploy while dev raced ahead 15 versions.
  # So a dev/stage push does not deploy itself — it re-enters this workflow ON
  # MAIN, which rebuilds the whole artifact: production from main, plus the
  # /dev/ and /stage/ previews assembled from their own refs (see the deploy
  # job's assembly step — the refs are inputs, main is always the root).
  # workflow_dispatch is one of the documented events GITHUB_TOKEN may trigger,
  # and the dispatched run is on main, so it never re-dispatches itself.
  refresh-previews:
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Re-run this deploy on main (rebuilds /dev/ + /stage/ previews)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "push to ${GITHUB_REF#refs/heads/} — dispatching deploy.yml on main to refresh the previews"
          gh workflow run deploy.yml --ref main

  deploy:
    # Pages deploys run from main ONLY (the github-pages environment rejects
    # other refs outright — see refresh-previews above).
    if: github.ref == 'refs/heads/main'
    # Intentionally NOT `needs: test` — the static site must stay live regardless of the
    # soft test signal above (a flaky test froze it for ~21h). Runs in parallel with test.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (production is always the artifact root)
        uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assemble /stage/ and /dev/ stage previews (no-op until the refs exist)
        run: |
          for stage in stage dev; do
            if git fetch origin "$stage" 2>/dev/null; then
              sha="$(git rev-parse --short FETCH_HEAD)"
              git worktree add "_${stage}-src" FETCH_HEAD
              node tools/stage-preview.mjs "_${stage}-src" "$stage" "$sha"
              git worktree remove --force "_${stage}-src"
            else
              echo "stage-preview: no '$stage' ref yet — skipping /$stage/"
            fi
          done
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact (repo root + assembled previews)
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
