<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<!-- LF23 slice 1: a standalone, read-only route for ONE saved dashboard
     (?dash=<id>) — openable in a new tab from the Dashboards list/Home,
     with no Studio builder chrome. base=/ matches app/index.html's own
     convention so every relative reference below resolves from the repo
     root the same way. -->
<base href="/"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Analytics — Viewer</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg"/>
<link rel="apple-touch-icon" href="apple-touch-icon.png"/>
<meta name="theme-color" content="#d4773b"/>
<link rel="stylesheet" href="vendor/polecat-shell/tokens.css"/>
<link rel="stylesheet" href="app/studio.css"/>
<script src="app/gate-config.js"></script>
<script src="app/auth.js"></script>
<script src="app/gate.js"></script>
</head>
<body class="viewer-body">
<div id="app">
  <div id="viewerBar">
    <a id="viewerBack" class="viewer-back" href="app/" title="Back to Analytics" aria-label="Back to Analytics">
      <span data-ic="chevron-left"></span> <span class="viewer-btn-txt">Analytics</span>
    </a>
    <div class="viewer-title" id="viewerTitle"></div>
    <span class="viewer-badge">Viewer — read-only</span>
    <!-- LF23 slice 2: both hidden until boot() confirms the dashboard loaded (and, for
         Edit, that this account can develop) — see app/viewer.js. The label text is wrapped in
         .viewer-btn-txt so the mobile bar rule (studio.css) can collapse these to icon-only and
         fit a phone width — each keeps a title for the tooltip/aria name when text is hidden. -->
    <button id="viewerSaveCopy" class="viewer-savecopy-btn" type="button" hidden title="Save a copy" aria-label="Save a copy">
      <span data-ic="copy"></span> <span class="viewer-btn-txt">Save a copy</span>
    </button>
    <!-- #106/#107: export the dashboard from the viewer — offered to EVERYONE (like Save a copy),
         since downloading what you can already see is a view-level capability. Hidden until boot()
         confirms the dashboard loaded. The menu reuses the exact exporters.js pipeline. -->
    <div class="viewer-export-wrap">
      <button id="viewerExport" class="viewer-export-btn" type="button" hidden aria-haspopup="true" aria-expanded="false" title="Export" aria-label="Export">
        <span data-ic="download"></span> <span class="viewer-btn-txt">Export</span> <span class="viewer-export-caret" data-ic="chevron-down"></span>
      </button>
      <div id="viewerExportMenu" class="viewer-export-menu" role="menu" hidden>
        <button type="button" role="menuitem" data-exp="html"><span data-ic="code"></span> Dashboard (.html)</button>
        <button type="button" role="menuitem" data-exp="pdf"><span data-ic="image"></span> PDF (print)</button>
        <button type="button" role="menuitem" data-exp="spec"><span data-ic="duplicate"></span> Editable spec (.json)</button>
      </div>
    </div>
    <a id="viewerEditLink" class="viewer-edit-link" href="#" hidden title="Edit in Dashboard Builder" aria-label="Edit in Dashboard Builder">
      <span data-ic="edit"></span> <span class="viewer-btn-txt">Edit in Dashboard Builder</span>
    </a>
  </div>
  <div id="viewerStage">
    <iframe id="viewerFrame" title="Dashboard viewer"></iframe>
    <div class="viewer-empty" id="viewerEmpty">
      <div class="ces-ic" data-ic="layers"></div>
      <div class="ces-title">Dashboard not found</div>
      <div class="ces-desc">It may have been removed, or you don't have access to view it.</div>
      <a class="ces-btn" href="app/">Back to Analytics</a>
    </div>
  </div>
</div>
<script src="app/model.js"></script>
<!-- #106: Studio.genMock — deterministic sample rows for the demo/sample packs' data accesses,
     so a sample-backed dashboard renders (and exports) here instead of 404ing on the retired
     CDA server. Real (duckdb/httpvfs/credentialed/connection) data accesses still query live. -->
<script src="app/sampledata.js"></script>
<script src="app/sources/schema.js"></script>
<script src="app/sources/workspace.js"></script>
<script src="app/exporters.js"></script>
<script src="app/icons.js"></script>
<script src="app/viewer.js"></script>
</body>
</html>
